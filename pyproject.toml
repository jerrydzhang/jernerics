[tool.uv.workspace]
members = [
    "packages/jernerics",
    "packages/jernerics-schema",
    "packages/jernerics-server",
]

[tool.ruff]
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".vscode",
    "__pycache__",
    "build",
    "dist",
    "sklearn/externals",
    "doc/_build",
    "doc/auto_examples",
    "asv_benchmarks/env",
    "asv_benchmarks/html",
    "asv_benchmarks/results",
    "asv_benchmarks/benchmarks/cache",
    "examples",
]

[tool.ruff.lint]
preview = true
extend-select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "TID252",
]
ignore = [
    "E731",
    "E741",
    "E721",
    "F841",
    "RUF002",
    "RUF003",
    "RUF005",
    "RUF012",
    "RUF015",
    "RUF021",
    "BLE001",
    "PLW1510",
]

[tool.ty.src]
include = [
    "packages/*/src",
    "packages/*/tests",
]
[tool.ty.environment]
extra-paths = [
    "packages/jernerics/src",
    "packages/jernerics-server/src",
    "packages/jernerics-schema/src",
]

[tool.ty.rules]
possibly-missing-submodule = "ignore"

[tool.pytest.ini_options]
markers = [
    "remote: submits real jobs to remote backends; skipped unless JERNERICS_RUN_REMOTE=1",
]
filterwarnings = [
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
]
