[project]
name = "jernerics"
version = "1.0.0"
description = "Opinionated utilities for ml projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.19.1",
    "pyyaml>=6.0.2",
    "typing-extensions>=4.12.0",
    "cloudpickle>=3.0.0",
    "numpy>=2.3.3",
    "tomli-w>=1.0.0",
]

[project.scripts]
jernerics = "jernerics.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "ruff>=0.13.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ty>=0.0.21",
    "pre-commit>=4.5.1",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/jernerics",
]
include = [
    "src/jernerics/scripts/*.sh",
    "src/jernerics/scripts/*.job",
    "src/jernerics/templates/*.def",
]

[tool.ruff]
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".vscode",
    "__pycache__",
    "build",
    "dist",
    "sklearn/externals",
    "doc/_build",
    "doc/auto_examples",
    "asv_benchmarks/env",
    "asv_benchmarks/html",
    "asv_benchmarks/results",
    "asv_benchmarks/benchmarks/cache",
]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "E501",
    "W",
    "I",
    "CPY001",
    "PGH",
    "RUF",
    "TID252",
]
ignore = [
    "CPY001",
    "E731",
    "E741",
    "E721",
    "F841",
    "RUF002",
    "RUF003",
    "RUF005",
    "RUF012",
    "RUF015",
    "RUF021",
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
]

[tool.ty.src]
include = [
    "src",
]

[tool.jernerics.hpc]
host = "your-username@hpc.example.edu"
remote_dir = "~/experiments/jernerics"

[tool.jernerics.container]
partition = "priority"
time = "1:00:00"
mem = "16G"
cpus = 4

[tool.jernerics.shell]
partition = "priority"
cpus = 1
mem = "4G"
gpu = 0
