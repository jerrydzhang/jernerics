[project]
name = "jernerics"
version = "1.1.0"
description = "Opinionated utilities for ml projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.24.1",
    "pyyaml>=6.0.2",
    "typing-extensions>=4.12.0",
    "cloudpickle>=3.0.0",
    "numpy>=2.3.3",
    "tomli-w>=1.0.0",
    "pathspec>=0.12.1",
    "rich>=13.0.0",
    "mlflow>=3.11.1",
    "optuna>=4.8.0",
]

[project.optional-dependencies]
mlflow = [
    "mlflow-export-import",
]

[project.scripts]
jernerics = "jernerics.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "ruff>=0.13.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ty>=0.0.21",
    "pre-commit>=4.5.1",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv.sources]
mlflow-export-import = { git = "https://github.com/mlflow/mlflow-export-import.git" }

[tool.hatch.build.targets.wheel]
packages = [
    "src/jernerics",
]
include = [
    "src/jernerics/scripts/*.sh",
    "src/jernerics/scripts/*.job",
    "src/jernerics/templates/*.def",
]

[tool.ruff]
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".vscode",
    "__pycache__",
    "build",
    "dist",
    "sklearn/externals",
    "doc/_build",
    "doc/auto_examples",
    "asv_benchmarks/env",
    "asv_benchmarks/html",
    "asv_benchmarks/results",
    "asv_benchmarks/benchmarks/cache",
]

[tool.ruff.lint]
preview = true
extend-select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "TID252",
]
ignore = [
    "E731",
    "E741",
    "E721",
    "F841",
    "RUF002",
    "RUF003",
    "RUF005",
    "RUF012",
    "RUF015",
    "RUF021",
]

[tool.ty.src]
include = [
    "src",
]
