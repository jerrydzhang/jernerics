[project]
name = "jernerics-schema"
version = "0.1.0"
description = "Tracking wire contracts and typed records shared by jernerics and jernerics-server"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
