[project]
name = "jernerics-server"
version = "0.1.0"
description = "gRPC tracking server for jernerics"
requires-python = ">=3.12"
dependencies = [
    "jernerics-proto",
    "grpcio>=1.80.0",
    "boto3>=1.43.2",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv.sources]
jernerics-proto = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
