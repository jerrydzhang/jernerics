[project]
name = "jernerics-server"
version = "0.1.0"
description = "HTTP tracking server for jernerics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "jernerics-schema",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv.sources]
jernerics-schema = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
