[project]
name = "jernerics-server"
version = "0.1.0"
description = "gRPC tracking server for jernerics"
requires-python = ">=3.12"
dependencies = [
    "jernerics-proto",
    "grpcio>=1.71.0",
    "duckdb>=1.5.2",
]

[tool.uv.sources]
jernerics-proto = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
