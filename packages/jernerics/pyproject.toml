[project]
name = "jernerics"
version = "1.1.0"
description = "Opinionated utilities for ml projects"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.24.1",
    "pyyaml>=6.0.2",
    "typing-extensions>=4.12.0",
    "cloudpickle>=3.0.0",
    "numpy>=2.3.3",
    "tomli-w>=1.0.0",
    "pathspec>=0.12.1",
    "rich>=13.0.0",
    "optuna>=4.8.0",
    "jernerics-proto",
]

[tool.uv.sources]
jernerics-proto = { workspace = true }

[project.scripts]
jernerics = "jernerics.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "ruff>=0.13.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ty>=0.0.21",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jernerics"]
include = [
    "src/jernerics/scripts/*.sh",
    "src/jernerics/scripts/*.job",
    "src/jernerics/templates/*.def",
]


