syntax = "proto3";

package jernerics.tracking;

// The fundamental unit. One per log call.
// Written to local file as delimited protobuf, sent over gRPC to server.
message Envelope {
  string project     = 1;
  string study_name   = 2;
  int32  trial_id     = 3;
  int64  timestamp_ns = 4;
  int32  seq          = 5;

  oneof payload {
    SweepMetaEvent sweep_meta = 9;
    ParamEvent     param      = 10;
    MetricEvent    metric     = 11;
    ResultEvent    result     = 12;
    ArtifactEvent  artifact   = 13;
    TrialEndEvent  trial_end  = 14;
  }
}

// Sweep-level metadata, logged once at the start of a sweep.
message SweepMetaEvent {
  string git_hash = 1;
  string config   = 2; // raw config file contents
}

// Protobuf is typed, Python is not. Value represents any scalar.
message Value {
  oneof value {
    double float_val  = 1;
    int64  int_val    = 2;
    string string_val = 3;
    bool   bool_val   = 4;
  }
}

// An input parameter (e.g. learning rate, batch size).
message ParamEvent {
  string key   = 1;
  Value  value = 2;
}

// A scalar output measurement (e.g. loss, accuracy).
message MetricEvent {
  string key   = 1;
  double value = 2;
  int64  step  = 3; // optional, for time-series metrics
}

// Structured output (e.g. confusion matrix, Pareto frontier).
message ResultEvent {
  string key   = 1;
  string value = 2; // JSON-encoded
}

// A file produced by a task (e.g. model checkpoint, plot).
message ArtifactEvent {
  string key = 1;
}

// Sentinel. Written once when the tracker closes, signals end of trial.
message TrialEndEvent {}

message Ack {}

service TrackingService {
  rpc SendEvent(Envelope) returns (Ack);
}
