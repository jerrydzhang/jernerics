[project]
name = "jernerics-proto"
version = "0.1.0"
description = "Shared protobuf definitions for jernerics"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=6.30.0,<7.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.80.0",
]
