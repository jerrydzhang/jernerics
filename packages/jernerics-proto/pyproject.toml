[project]
name = "jernerics-proto"
version = "0.1.0"
description = "Shared protobuf definitions for jernerics"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=7.34.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jernerics_proto"]
