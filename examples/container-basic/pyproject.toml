[project]
name = "container-basic"
version = "0.1.0"
description = "Basic container example"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "jernerics",
]

[tool.uv.sources]
jernerics = { path = "../.." }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/container_basic"]
