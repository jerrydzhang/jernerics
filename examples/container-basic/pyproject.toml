[project]
name = "container-basic"
version = "0.1.0"
description = "Basic container example"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "jernerics",
]

[tool.uv.sources.jernerics]
git = "https://github.com/jerrydzhang/jernerics.git"
rev = "34955f46f48aa710977aadbfd475dc786ced9297"

[tool.hatch.build.targets.wheel]
packages = [
    "src/container_basic",
]

[tool.jernerics.hpc]
host = "jez21005@hpc2.storrs.hpc.uconn.edu"
remote_dir = "~/projects/container-basic"

[tool.jernerics.container]
partition = "priority"
time = "1:00:00"
mem = "16G"
cpus = 4

[tool.jernerics.shell]
partition = "priority"
cpus = 1
mem = "4G"
gpu = 0

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
