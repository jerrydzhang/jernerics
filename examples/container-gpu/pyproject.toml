[project]
name = "container-gpu"
version = "0.1.0"
description = "GPU container example with PyTorch (CUDA wheels, GPU via Apptainer --nv)"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "jernerics",
]

[tool.uv.sources]
jernerics = { git = "https://github.com/jerrydzhang/jernerics.git", rev = "9684d9750e75c14a575aa3a3e3a3a09281a15180" }
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/container_gpu"]
