[project]
name = "container-gpu"
version = "0.1.0"
description = "GPU container example with PyTorch (CUDA 13.0 via PyPI default, GPU via Apptainer --nv)"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "jernerics",
]

[tool.uv.sources.jernerics]
git = "https://github.com/jerrydzhang/jernerics.git"

[tool.jernerics.hpc]
host = "user@cluster.edu"
remote_dir = "~/projects/container-gpu"

[tool.jernerics.container]
partition = "priority-gpu"
time = "1:00:00"
mem = "16G"
cpus = 4

[tool.jernerics.shell]
partition = "priority-gpu"
cpus = 1
mem = "4G"
gpu = 1

[tool.hatch.build.targets.wheel]
packages = [
    "src/container_gpu",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
