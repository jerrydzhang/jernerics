[project]
name = "sweep-parallel"
version = "0.1.0"
description = "Parallel Optuna sweep testing concurrent SQLite access with max_parallel constraint"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "jernerics",
]

[tool.uv.sources.jernerics]
git = "https://github.com/jerrydzhang/jernerics.git"
branch = "human-ownership"
subdirectory = "packages/jernerics"

[tool.hatch.build.targets.wheel]
packages = ["src/sweep_parallel"]

[tool.jernerics.backends.hpc]
type = "slurm"
host = "jez21005@hpc2.storrs.hpc.uconn.edu"
remote_dir = "~/projects/jernerics-examples/sweep-parallel"
cache_dir = "/scratch/qiy18011/jez21005/jernerics"

[tool.jernerics.backends.hpc.slurm]
partition = "priority"
time = "0:10:00"
mem = "4G"
cpus = 4

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
