[project]
name = "resume-partial-failure"
version = "0.1.0"
description = "Test DAG resume after partial failure"
requires-python = ">=3.12"
dependencies = [
    "jernerics",
]

[tool.uv.sources.jernerics]
git = "https://github.com/jerrydzhang/jernerics.git"
branch = "optuna-mlflow-integration"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
