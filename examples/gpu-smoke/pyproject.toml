[project]
name = "gpu-smoke"
version = "0.1.0"
description = "GPU smoke test — verify CUDA access in container"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "jernerics",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[tool.uv.sources.jernerics]
git = "https://github.com/jerrydzhang/jernerics.git"
branch = "optuna-mlflow-integration"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_smoke"]

[tool.jernerics.hpc]
host = "jez21005@hpc2.storrs.hpc.uconn.edu"
remote_dir = "~/projects/jernerics-examples/gpu-smoke"
cache_dir = "/scratch/qiy18011/jez21005/jernerics"

[tool.jernerics.container]
partition = "priority-gpu"
mem = "32G"
time = "0:30:00"
cpus = 4

[tool.jernerics.shell]
partition = "priority-gpu"
cpus = 1
mem = "4G"
gpu = 1

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
