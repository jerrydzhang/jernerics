repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff format --force-exclude
        language: system
        types: [python]

      - id: ty
        name: ty
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false
